services:
  dockerpulse-agent:
    image: ghcr.io/farmers00/dockerpulse:latest
    container_name: dockerpulse-agent
    restart: unless-stopped
    volumes:
      # Docker socket for container control
      - /var/run/docker.sock:/var/run/docker.sock
      # Host compose directory to manage (~/docker on host)
      - ${HOME}/docker:/root/docker
    command: >
      agent
      --server ws://manager-ip-or-domain:8080/ws/agent
      --token dockerpulse_agent_shared_join_token_2026
      --host-id node-1
      --base-dir /root/docker
